spring:
  application:
    name: smartlog-api

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:}

smartlog:
  security:
    # Atalho de autenticação local (sem Firebase). Desabilitado por padrão: sem Firebase
    # e sem dev-auth, qualquer requisição a endpoint protegido recebe 401.
    # Ative com o perfil "dev" (application-dev.yml) ou SMARTLOG_DEV_AUTH_ENABLED=true
    # + SMARTLOG_DEV_AUTH_TOKEN.
    dev-auth:
      enabled: ${SMARTLOG_DEV_AUTH_ENABLED:false}
      token: ${SMARTLOG_DEV_AUTH_TOKEN:}
    cors:
      # Lista separada por vírgulas de origens permitidas (sem curingas).
      allowed-origins: ${SMARTLOG_CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: SmartLog API
    description: API REST para operação logística
    version: 0.0.1-SNAPSHOT
